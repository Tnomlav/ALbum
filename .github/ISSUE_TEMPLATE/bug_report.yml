name: Bug report
description: 报告一个可以复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 请说明实际结果和期望结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开...\n2. 点击...\n3. 观察..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备与版本
      placeholder: "例如：Pixel 7 / Android 14 / Album v1.1.33"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请移除个人媒体、Cookie、路径和其他敏感信息后再上传。
